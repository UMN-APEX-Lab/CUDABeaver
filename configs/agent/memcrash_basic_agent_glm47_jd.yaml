api:
  backend: openai
  model: GLM-4.7
  base_url: <CLOUD_API_BASE_URL>  # OpenAI-compatible endpoint, e.g. https://your-provider/v1
  api_key_env: CLOUD_API_KEY
  temperature: 0
  max_tokens: 32768
  extra_body:
    thinking:
      type: enabled
      budget_tokens: 16384
experiment:
  name: memcrash_basic_agent_glm47_jd
  method: agent
  max_iterations: 5
  dataset_dir: data
  output_dir: results_memcrash_basic_agent_glm47_jd
  tasks:
  - cuda_123
  - cuda_151
  - kernelbench_level1_26
  - kernelbench_level1_36
  - kernelbench_level1_37
  - kernelbench_level1_45
  - kernelbench_level1_48
  - kernelbench_level1_59
  - kernelbench_level1_60
  - kernelbench_level1_71
  - kernelbench_level1_81
  - kernelbench_level1_86
  - kernelbench_level1_92
  - kernelbench_level2_12
  - kernelbench_level2_3
  - kernelbench_level2_33
  error_category: memory_crash
build:
  timeout: 300
  test_timeout: 300
  workdir: /tmp/cuda_debugger_workspace_agent_memcrash_glm47_jd
agent:
  workflow: blackboard
  tools: null
  action_protocol: json
  tool_decision_max_tokens: 32768
  max_patch_submissions: 5
  max_tool_calls_per_task: 200
  hard_stop_stagnation: false
  performance_gate:
    enabled: true
    min_speedup: 0.7
    fail_on_skipped: true
  quotas:
    read_code: 20
    read_test_file: 10
    read_prompt: 2
    run_static_analysis: 10
    run_compute_sanitizer: 12
    build_only: 10
    test_only: 10
  blackboard:
    coder_force_locate_first: true
    max_role_turns: 3
    max_coder_turns: 8
    max_coder_non_submission_rounds: 3
    analyzer_tools:
    - read_code
    - read_test_file
    - read_prompt
    - run_static_analysis
    - locate_bug
    executor_tools:
    - read_code
    - read_test_file
    - build_only
    - test_only
    - run_compute_sanitizer
    - locate_bug
    coder_tools:
    - read_code
    - read_test_file
    - read_prompt
    - locate_bug
    - apply_edit
    - write_solution
    - build_only
  token_budget: 70000
  budget_warn_ratio: 0.8
  budget_force_ratio: 0.95
  keep_recent_tool_exchanges: 6
  compact_old_iterations: true
  tool_result_cap_chars: 8000
  use_llm_summary: false
  summary_target_chars: 4000
  summary_max_tokens: 32768
  max_summary_calls: 40
  tool_choice: required
logging:
  level: INFO
  save_api_responses: true
